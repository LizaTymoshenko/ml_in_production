apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-fastapi-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-fastapi
  template:
    metadata:
      labels:
        app: test-fastapi
    spec:
      containers:
        - name: test-fastapi-container
          image: lizatym/test_fastapi:latest
          ports:
            - containerPort: 80
